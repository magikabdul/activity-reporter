apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: krisoo
  labels:
    app: reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      containers:
      - name: reporter
        image: magikabdul/reporter:1.1.0
        ports:
        - name: http
          containerPort: 7500
        # actuator only - deliberately not exposed by the Service/Ingress
        - name: management
          containerPort: 7501
        env:
        - name: TZ
          value: Europe/Warsaw
        - name: database-host
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-host
        - name: database-port
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-port
        - name: database-name
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-name
        - name: database-user
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-user
        - name: database-password
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-password
        - name: flyway-url
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: flyway-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: openai-api-key
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0 -XX:MaxDirectMemorySize=256M -XX:+ExitOnOutOfMemoryError"
        resources:
          requests:
            memory: "2048Mi"
            cpu: "500m"
          limits:
            memory: "4096Mi"
            cpu: "1000m"
        # JVM start + Flyway against the remote database takes a while: up to 30 x 5s before liveness kicks in
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reporter-service
  namespace: krisoo
spec:
  selector:
    app: reporter
  ports:
    - protocol: TCP
      port: 7500
      targetPort: 7500
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporter-ingress
  namespace: krisoo
spec:
  # required: without it ingress-nginx ignores this Ingress (there is no default IngressClass on the cluster)
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /reporter
        pathType: Prefix
        backend:
          service:
            name: reporter-service
            port:
              number: 7500
