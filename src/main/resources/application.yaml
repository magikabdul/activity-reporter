spring:
  application:
    name: reporter
  web:
    locale: en_US
  webflux:
    base-path: /reporter
  profiles:
    active: reporter
  lifecycle:
    # how long in-flight requests may finish after SIGTERM. The default 30s is too short here: a
    # Lufthansa report waits for up to 7 sequential OpenAI calls. Keep below the pod's
    # terminationGracePeriodSeconds minus the preStop sleep (k8s-deployment.yaml).
    timeout-per-shutdown-phase: 90s
  datasource:
    host: ${database-host:localhost}
    port: ${database-port:1433}
    database: ${database-name:dummyName}
    username: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
  flyway:
    url: ${flyway-url:localhost}
    user: ${database-user:dummyUser}
    password: ${database-password:dummyPassword}
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:change-me}
      chat:
        options:
          # OPENAI_MODEL switches the model without a new release (e.g. a cheaper one for a trial)
          model: ${OPENAI_MODEL:gpt-4o}
          # hard ceiling per answer: the longest one is a Trecom task with 2000 chars of notes plus the reasoning
          max-completion-tokens: 2000
          # retries are done by the OpenAI SDK (Spring AI 2.x has no RetryTemplate around the chat model):
          # 3 attempts x 25s stays below the 90s shutdown phase above and the 180s ingress timeout
          timeout: 25s
          max-retries: 2
server:
  port: 7500
  # the default since Spring Boot 3.4, stated explicitly because the rollout relies on it:
  # stop accepting new requests on SIGTERM, let the running ones finish
  shutdown: graceful

reporter:
  time-zone: Europe/Warsaw

# Actuator listens on its own port: it is not part of the Service/Ingress (so never reachable from outside
# the cluster) and is not affected by spring.webflux.base-path. Used by the k8s probes.
management:
  server:
    port: 7501
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
