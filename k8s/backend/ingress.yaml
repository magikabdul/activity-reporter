# Host-less, no TLS: the backend on the LoadBalancer IP under /reporter. The browser goes through the host-based
# Ingress in ../frontend/ingress.yaml instead, which routes /reporter to the same Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporter-ingress
  namespace: krisoo
spec:
  # required: without it ingress-nginx ignores this Ingress (there is no default IngressClass on the cluster)
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /reporter
        pathType: Prefix
        backend:
          service:
            name: reporter-service
            port:
              number: 7500
