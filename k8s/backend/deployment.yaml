apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: krisoo
  labels:
    app: reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
      # picked up by the Prometheus job "krisoo-pods" (deployment-tools repo, k8s/monitoring/prometheus);
      # the metrics live on the management port, which the Service/Ingress do not expose
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7501"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # preStop sleep (10s) + spring.lifecycle.timeout-per-shutdown-phase (90s) + margin
      terminationGracePeriodSeconds: 120
      containers:
      - name: reporter
        image: magikabdul/reporter:1.1.1
        # Zero-downtime rollout. On termination Kubernetes removes the pod from the Service endpoints and sends
        # SIGTERM at the same time, but ingress-nginx needs a few seconds to drop the upstream - and the app's
        # graceful shutdown stops accepting connections within milliseconds, so those seconds were answered with 502.
        # The sleep keeps the pod serving until the ingress has caught up; only then SIGTERM is delivered.
        # Native sleep action (k8s >= 1.30): the Paketo image has no shell and no `sleep` binary for an exec hook.
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        ports:
        - name: http
          containerPort: 7500
        # actuator only - deliberately not exposed by the Service/Ingress
        - name: management
          containerPort: 7501
        env:
        - name: TZ
          value: Europe/Warsaw
        - name: database-host
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-host
        - name: database-port
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-port
        - name: database-name
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-name
        - name: database-user
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-user
        - name: database-password
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: database-password
        - name: flyway-url
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: flyway-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: reporter-secrets
              key: openai-api-key
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0 -XX:MaxDirectMemorySize=256M -XX:+ExitOnOutOfMemoryError"
        resources:
          requests:
            memory: "2048Mi"
            cpu: "500m"
          limits:
            memory: "4096Mi"
            cpu: "1000m"
        # JVM start + Flyway against the remote database takes a while: up to 30 x 5s before liveness kicks in
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: reporter-service
  namespace: krisoo
spec:
  selector:
    app: reporter
  ports:
    - protocol: TCP
      port: 7500
      targetPort: 7500
  type: ClusterIP
